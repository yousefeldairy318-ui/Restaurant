<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>احجز | دار الجمر</title><meta name="description" content="دار الجمر: مشويات على الفحم الحقيقي وأطباق مصرية أصيلة."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="./Style.css"></head><body><header id="hd"></header><main>
<div class="ph"><div class="wrap"><h1>احجز ترابيزة</h1><p>املا البيانات وهيتفتح واتساب برسالة الحجز جاهزة.</p></div></div>
<section><div class="wrap two"><form id="book" novalidate>
<div><label for="n">الاسم</label><input id="n" autocomplete="name"></div>
<div><label for="p">رقم الموبايل</label><input id="p" type="tel" dir="ltr" inputmode="tel" placeholder="01xxxxxxxxx"></div>
<div class="row"><div><label for="d">اليوم</label><input id="d" type="date"></div><div><label for="t">الساعة</label><input id="t" type="time" value="20:00"></div></div>
<div><label for="g">عدد الأفراد</label><select id="g"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>8</option><option>10 أو أكتر</option></select></div>
<div><label for="nt">ملاحظات (اختياري)</label><input id="nt"></div>
<button class="btn" type="submit">ابعت الحجز على واتساب</button><p class="msg" id="msg" role="status"></p></form>
<div class="info"><h3>مواعيد العمل</h3><ul class="hours"><li><span>السبت – الخميس</span><span>1 ظ – 1 ص</span></li><li><span>الجمعة</span><span>2 ظ – 2 ص</span></li></ul><p>للمجموعات فوق 10 أفراد يفضل الحجز قبلها بيومين.</p></div></div></section>
</main><footer id="ft"></footer><script src="script.js"></script></body></html>
